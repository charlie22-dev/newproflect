<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Mimalicious</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { padding-top: 0; min-height: 100dvh; background: #1a0a02; }
    /* ── Admin Login Screen ─────────────────────────────────── */
    .admin-login-screen {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 2rem;
      background: #1a0a02;
      background-image: radial-gradient(circle, rgba(245,166,35,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .admin-login-card {
      background: var(--white); border-radius: 28px; padding: 3rem 2.5rem;
      border: 4px solid var(--yellow); box-shadow: 10px 10px 0 var(--brown), 0 40px 80px rgba(0,0,0,0.4);
      width: 100%; max-width: 420px; text-align: center;
      animation: card-enter 350ms var(--ease-out) both;
    }
    @keyframes card-enter { from { opacity:0; transform:translateY(20px) scale(0.97); } to { opacity:1; transform:none; } }
    .admin-login-card .logo { font-size: 2.2rem; display: block; margin-bottom: 0.4rem; }
    .admin-login-card h2 { font-family: var(--font-display); font-size: 1.8rem; color: var(--red); margin-bottom: 0.3rem; letter-spacing: 0.04em; }
    .admin-login-card p { font-weight: 600; color: var(--brown-mid); font-size: 0.88rem; margin-bottom: 2rem; }
    .admin-err { color: var(--red); font-weight: 700; font-size: 0.82rem; margin-top: 0.5rem; min-height: 1.2rem; }
    /* ── Admin Dashboard ────────────────────────────────────── */
    .admin-wrap { display: none; flex-direction: column; min-height: 100dvh; }
    .admin-topbar {
      background: var(--brown); border-bottom: 4px solid var(--yellow);
      padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-topbar .logo { font-size: 1.6rem; }
    .admin-badge {
      background: var(--red); color: var(--white); font-family: var(--font-display);
      font-size: 0.75rem; padding: 0.25rem 0.8rem; border-radius: 50px; letter-spacing: 0.08em;
      border: 2px solid var(--yellow); margin-left: 0.7rem;
    }
    .admin-main { flex: 1; padding: 2.5rem 5%; max-width: 1300px; margin: 0 auto; width: 100%; }
    .admin-heading {
      font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3rem);
      color: var(--yellow); text-transform: uppercase; letter-spacing: 0.04em;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.4); margin-bottom: 0.4rem;
    }
    .admin-sub { font-weight: 700; color: rgba(245,237,214,0.55); margin-bottom: 2rem; font-size: 0.9rem; }
    /* ── Order Cards ─────────────────────────────────────────── */
    .admin-orders { display: grid; gap: 1.2rem; }
    .admin-order-card {
      background: var(--white); border: 3.5px solid var(--brown); border-radius: 18px;
      box-shadow: 6px 6px 0 var(--yellow); overflow: hidden;
      transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
    }
    .admin-order-card:hover { transform: translateY(-3px); box-shadow: 9px 11px 0 var(--yellow); }
    .admin-card-head {
      display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 0.8rem;
      align-items: center; padding: 1rem 1.3rem;
      background: #fffdf5; border-bottom: 1.5px dashed rgba(59,26,8,0.12);
    }
    .admin-order-id { font-family: var(--font-display); font-size: 1.1rem; color: var(--red); }
    .admin-meta { font-size: 0.82rem; font-weight: 700; color: var(--brown-mid); }
    .admin-val { font-weight: 800; font-size: 1rem; color: var(--brown); }
    .status-badge { display:inline-flex; align-items:center; justify-content:center; min-width:100px; height:28px; border:2px solid var(--brown); border-radius:999px; font-size:0.75rem; font-weight:900; text-transform:uppercase; padding:0 0.7rem; letter-spacing:0.04em; }
    .status-pending { background:#ffe08a; color:#4b3900; }
    .status-preparing { background:#b9e6ff; color:#003a5a; }
    .status-ready { background:#ffd6a5; color:#5a2e00; }
    .status-delivered { background:#c8f3ce; color:#154d1d; }
    .status-cancelled { background:#ffc9c9; color:#5b1717; }
    .admin-card-body { padding: 1rem 1.3rem; }
    .admin-info-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 0.8rem; font-size: 0.85rem; font-weight: 700; }
    .admin-info-row span { color: var(--brown-mid); }
    .admin-status-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .admin-status-label { font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brown); }
    .admin-status-select {
      height: 34px; border: 2.5px solid var(--brown); border-radius: 10px;
      background: var(--white); font-weight: 800; color: var(--brown); padding: 0 0.6rem;
      font-family: var(--font-body); font-size: 0.88rem; cursor: pointer;
      transition: border-color 160ms var(--ease-out);
    }
    .admin-status-select:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(245,166,35,0.2); }
    .items-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .items-table th, .items-table td { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid rgba(59,26,8,0.08); }
    .items-table th { text-transform: uppercase; font-size: 0.72rem; color: var(--brown-mid); font-weight: 800; letter-spacing: 0.04em; }
    .items-table td { font-weight: 700; }
    .admin-empty {
      text-align: center; padding: 4rem 2rem; color: var(--yellow);
    }
    .admin-empty h3 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.8rem; }
    .admin-empty p { font-weight: 600; color: rgba(245,237,214,0.5); }
    @media (max-width: 700px) {
      .admin-card-head { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══ LOGIN SCREEN ═══ -->
  <div class="admin-login-screen" id="loginScreen">
    <div class="admin-login-card">
      <a href="index.html" class="logo">MIMALICIOUS</a>
      <h2>Admin Access</h2>
      <p>Enter the admin password to continue</p>
      <form id="adminLoginForm">
        <div class="form-group" style="text-align:left;">
          <label for="adminPw">Password</label>
          <input type="password" id="adminPw" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn" id="admin-login-btn">ENTER DASHBOARD</button>
        <div class="admin-err" id="adminErr"></div>
      </form>
      <a href="home.html" class="back-link" style="margin-top:1.5rem;display:block;">← Back to Site</a>
    </div>
  </div>

  <!-- ═══ ADMIN DASHBOARD ═══ -->
  <div class="admin-wrap" id="adminWrap">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:0;">
        <a href="home.html" class="logo">MIMALICIOUS</a>
        <span class="admin-badge">ADMIN</span>
      </div>
      <button class="nav-button" onclick="adminLogout()" id="admin-logout-btn">LOGOUT</button>
    </header>

    <main class="admin-main">
      <h1 class="admin-heading">Order Dashboard</h1>
      <p class="admin-sub">View and manage all customer orders. Updates reflect immediately on the Order History page.</p>
      <div class="admin-orders" id="adminOrders"></div>
    </main>
  </div>

<script>
  const ORDER_HISTORY_KEY = "mimaliciousOrderHistory";
  const ADMIN_KEY = "mimaAdminLoggedIn";
  const ADMIN_PASSWORD = "admin2026";
  const ORDER_STATUSES = ["Pending", "Preparing", "Ready", "Delivered", "Cancelled"];

  function escapeHtml(v) { return String(v||'').replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  function formatDate(d) { if (!d) return "N/A"; const o = new Date(d); return isNaN(o.getTime()) ? "N/A" : o.toLocaleString(); }
  function formatPeso(v) { return "₱" + Number(v || 0).toFixed(2); }
  function loadOrders() { try { const raw = localStorage.getItem(ORDER_HISTORY_KEY); const p = raw ? JSON.parse(raw) : []; return Array.isArray(p) ? p : []; } catch(e) { return []; } }
  function normalizeStatus(s) { return ORDER_STATUSES.includes(s) ? s : "Pending"; }
  function statusClass(s) { return "status-" + normalizeStatus(s).toLowerCase(); }

  // ── Auth ──────────────────────────────────────────────────
  function checkAuth() {
    if (localStorage.getItem(ADMIN_KEY) === "true") showDashboard();
  }
  function adminLogout() { localStorage.removeItem(ADMIN_KEY); document.getElementById("loginScreen").style.display = "flex"; document.getElementById("adminWrap").style.display = "none"; document.getElementById("adminPw").value = ""; }

  document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const pw = document.getElementById("adminPw").value;
    const err = document.getElementById("adminErr");
    if (pw === ADMIN_PASSWORD) {
      err.textContent = "";
      localStorage.setItem(ADMIN_KEY, "true");
      showDashboard();
    } else {
      err.textContent = "Incorrect password. Try again.";
      document.getElementById("adminPw").value = "";
      document.getElementById("adminPw").focus();
    }
  });

  function showDashboard() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminWrap").style.display = "flex";
    renderAdminOrders();
  }

  // ── Update status ─────────────────────────────────────────
  function adminUpdateStatus(i, val) {
    const orders = loadOrders();
    if (!orders[i]) return;
    orders[i].status = normalizeStatus(val);
    localStorage.setItem(ORDER_HISTORY_KEY, JSON.stringify(orders));
    renderAdminOrders();
  }

  // ── Render ────────────────────────────────────────────────
  function renderAdminOrders() {
    const orders = loadOrders();
    const container = document.getElementById("adminOrders");
    if (orders.length === 0) {
      container.innerHTML = `<div class="admin-empty"><h3>No Orders Yet</h3><p>Orders placed from the menu will appear here.</p></div>`;
      return;
    }
    const cards = [];
    for (let i = orders.length - 1; i >= 0; i--) {
      const o = orders[i] || {};
      const items = Array.isArray(o.items) ? o.items : [];
      const status = normalizeStatus(o.status);
      const total = Number(o.total || 0);
      const itemCount = items.reduce((s, it) => s + Number(it.quantity || it.qty || 0), 0);
      const opts = ORDER_STATUSES.map(s => `<option value="${s}"${s === status ? " selected" : ""}>${s}</option>`).join("");
      const itemRows = items.map(it => {
        const q = Number(it.quantity || it.qty || 0);
        return `<tr><td>${escapeHtml(it.item||it.name||'?')}</td><td>${escapeHtml(it.size||'-')}</td><td>${q}</td><td>${formatPeso(it.price||0)}</td><td>${formatPeso((it.price||0)*q)}</td></tr>`;
      }).join("");
      const codDetails = o.paymentMethod === 'COD'
        ? `<div><span>Recipient:</span> ${escapeHtml(o.recipientName||'N/A')}</div><div><span>Address:</span> ${escapeHtml(o.deliveryAddress||'N/A')}</div>` : '';

      cards.push(`<div class="admin-order-card">
        <div class="admin-card-head">
          <div><div class="admin-order-id">Order #${orders.length - i}</div><div class="admin-meta">${formatDate(o.date)}</div></div>
          <div><div class="admin-meta">Items</div><div class="admin-val">${itemCount}</div></div>
          <div><div class="admin-meta">Total</div><div class="admin-val">${formatPeso(total)}</div></div>
          <span class="status-badge ${statusClass(status)}">${status}</span>
        </div>
        <div class="admin-card-body">
          <div class="admin-info-row">
            <div><span>Payment:</span> ${escapeHtml(o.paymentMethod||'N/A')}</div>
            ${codDetails}
          </div>
          <div class="admin-status-row">
            <span class="admin-status-label">Update Status:</span>
            <select class="admin-status-select" onchange="adminUpdateStatus(${i}, this.value)">${opts}</select>
          </div>
          <table class="items-table">
            <thead><tr><th>Item</th><th>Size</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
            <tbody>${itemRows || "<tr><td colspan='5'>No items.</td></tr>"}</tbody>
          </table>
        </div>
      </div>`);
    }
    container.innerHTML = cards.join("");
  }

  // ── Live sync ─────────────────────────────────────────────
  window.addEventListener("storage", e => {
    if (e.key === ORDER_HISTORY_KEY && localStorage.getItem(ADMIN_KEY) === "true") renderAdminOrders();
  });

  checkAuth();
</script>
</body>
</html>
